<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理員入口</title><style>:root{font-family:"Microsoft JhengHei",sans-serif;color:#173a38;background:#eef7f6}*{box-sizing:border-box}body{margin:0}.top{padding:1rem 5vw;background:#073b3a;color:#fff}.wrap{max-width:1000px;margin:2rem auto;padding:0 1rem}.card{background:#fff;padding:1.25rem;border-radius:1rem;box-shadow:0 10px 35px #073b3a18;margin-bottom:1rem}h1,h2{margin-top:0}label{display:block;font-weight:800;margin:.75rem 0 .25rem}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:.68rem;border:1px solid #79a8a5;border-radius:.5rem}button{padding:.7rem 1rem;border:0;border-radius:.5rem;background:#087f7a;color:#fff;font-weight:800;cursor:pointer;margin:.4rem .35rem .2rem 0}.secondary{background:#64748b}.danger{background:#a4342a}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.msg{min-height:1.4rem;font-weight:800;color:#a4342a}.ok{color:#087f3d}.item{border:1px solid #b7d7d5;border-radius:.7rem;padding:1rem;margin:.8rem 0}.checks{display:flex;flex-wrap:wrap;gap:.45rem}.checks label{font-weight:500;border:1px solid #b7d7d5;padding:.4rem;border-radius:.4rem;margin:0}.checks input{width:auto}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top">護理新人臨床急症情境手冊｜管理員入口</header><main class="wrap"><section class="card" id="login"><h1>管理員 Email 驗證</h1><p>只有預設管理員 <strong>icu001319@gmail.com</strong> 可以登入。</p><form id="email-form"><label>管理員 Email</label><input name="email" type="email" required value="icu001319@gmail.com"><button>寄送驗證碼</button><p class="msg" id="email-msg"></p></form><form id="otp-form" class="hidden"><label>六位數驗證碼</label><input name="code" inputmode="numeric" pattern="[0-9]{6}" required><button>驗證並進入</button><p class="msg" id="otp-msg"></p></form></section><section class="card hidden" id="portal"><h1>教師註冊與權限管理</h1><button id="refresh">重新整理</button><div id="teachers"></div></section></main><script>(()=>{'use strict';let otpId='',token='',units=[];const q=s=>document.querySelector(s),err=el=>e=>el.textContent=(e&&e.message)||'操作失敗';function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}google.script.run.withSuccessHandler(r=>units=r.units).getPublicUnits();q('#email-form').onsubmit=e=>{e.preventDefault();const m=q('#email-msg');m.textContent='寄送中…';google.script.run.withSuccessHandler(r=>{otpId=r.otpId;m.textContent='驗證碼已寄出';q('#otp-form').classList.remove('hidden')}).withFailureHandler(err(m)).requestEmailCode('admin','',e.currentTarget.email.value)};q('#otp-form').onsubmit=e=>{e.preventDefault();google.script.run.withSuccessHandler(r=>{token=r.token;q('#login').classList.add('hidden');q('#portal').classList.remove('hidden');load()}).withFailureHandler(err(q('#otp-msg'))).verifyEmailCode(otpId,e.currentTarget.code.value)};q('#refresh').onclick=load;function load(){google.script.run.withSuccessHandler(r=>{q('#teachers').innerHTML=r.teachers.length?r.teachers.map(card).join(''):'<p>目前沒有教師申請。</p>';document.querySelectorAll('.review').forEach(f=>f.onsubmit=review)}).withFailureHandler(err(q('#teachers'))).adminListTeachers(token)}function card(t){return '<article class="item"><h2>'+esc(t.name)+'｜'+esc(t.employeeId)+'</h2><p>申請單位：'+esc(t.unit)+'｜Email：'+esc(t.email)+'｜狀態：'+esc(t.status)+'</p><form class="review" data-id="'+esc(t.employeeId)+'"><p><strong>授權單位</strong></p><div class="checks">'+units.map(u=>'<label><input type="checkbox" name="units" value="'+esc(u)+'"'+((t.units||[]).includes(u)?' checked':'')+'>'+esc(u)+'</label>').join('')+'</div><button name="decision" value="approved">核准／更新權限</button><button class="secondary" name="decision" value="disabled">停用</button><button class="danger" name="decision" value="rejected">拒絕</button><span class="msg"></span></form></article>'}function review(e){e.preventDefault();const f=e.currentTarget,d=e.submitter.value,chosen=[...f.querySelectorAll('input[name=units]:checked')].map(x=>x.value),m=f.querySelector('.msg');if(d==='approved'&&!chosen.length){m.textContent='核准時至少選一個單位';return}google.script.run.withSuccessHandler(()=>{m.textContent='已更新';load()}).withFailureHandler(err(m)).adminReviewTeacher(token,f.dataset.id,d,chosen)}})();</script></body></html>
