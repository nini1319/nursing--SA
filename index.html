<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>護理新人臨床急症情境手冊</title><style>:root{font-family:"Microsoft JhengHei",sans-serif;color:#153b39}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#e9f7f5,#fff7e8)}main{width:min(92%,780px);background:#fff;padding:clamp(1.4rem,5vw,3rem);border-radius:1.2rem;box-shadow:0 18px 60px #073b3a22}h1{margin-top:0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:2rem}a{display:block;padding:1.4rem;border-radius:.8rem;text-decoration:none;font-weight:900;text-align:center}.student{background:#087f7a;color:#fff}.teacher{border:2px solid #087f7a;color:#075e5a}small{display:block;margin-top:.5rem;font-weight:500}@media(max-width:600px){.choices{grid-template-columns:1fr}}</style></head><body><main><h1>護理新人臨床急症情境手冊</h1><p>請依身分選擇入口。學員進行自學、作答與提交；老師進入單位名冊、選擇學員並評分。</p><div class="choices"><a class="student" href="https://script.google.com/macros/s/AKfycbwf-Yc04DVc-fCDw_XxTzrIBhJdooq_IDR0e9XOOfe0sj3CQ3i-G6PDVwgVTQqYwkXJvQ/exec?view=student">學員入口<small>自學、練習、提交作答</small></a><a class="teacher" href="https://script.google.com/macros/s/AKfycbwf-Yc04DVc-fCDw_XxTzrIBhJdooq_IDR0e9XOOfe0sj3CQ3i-G6PDVwgVTQqYwkXJvQ/exec?view=teacher">老師入口<small>單位 → 員工編號與姓名 → 評分</small></a></div></main></body></html>
