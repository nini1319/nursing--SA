<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教師評分入口</title><style>
:root{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#163332;background:#eef7f6}*{box-sizing:border-box}body{margin:0}.top{padding:1rem 5vw;background:#073b3a;color:#fff;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff}.wrap{max-width:1100px;margin:2rem auto;padding:0 1rem}.card{background:#fff;border-radius:1rem;box-shadow:0 10px 35px #063b3b18;padding:1.3rem;margin-bottom:1rem}h1,h2{margin-top:0}label{display:block;font-weight:800;margin:.8rem 0 .3rem}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:.7rem;border:1px solid #78a8a5;border-radius:.5rem}textarea{min-height:7rem}button{padding:.7rem 1rem;border:0;border-radius:.55rem;background:#087f7a;color:#fff;font-weight:800;cursor:pointer}button:disabled{opacity:.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.hidden{display:none!important}.msg{min-height:1.5rem;font-weight:800;color:#a4342a}.student-label{font-size:1.1rem;font-weight:900}.submission{border:1px solid #b9d9d7;border-radius:.75rem;padding:1rem;margin:1rem 0}.meta{color:#526d6b}.note{white-space:pre-wrap;background:#f4f8f8;padding:.8rem;border-radius:.5rem}.scores{font-weight:800;color:#75480b}.save-status{margin-left:.6rem;font-weight:800}.ok{color:#087f3d}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body>
<header class="top"><strong>護理新人臨床急症情境手冊｜教師評分</strong><a href="?view=student">前往學員入口</a></header><main class="wrap">
<section class="card" id="login"><h1>教師專用入口</h1><p>登入後只會顯示您被授權的單位。請勿與學生共用存取碼。</p><form id="login-form"><label for="email">教師 Email</label><input id="email" type="email" autocomplete="username" required><label for="code">教師存取碼</label><input id="code" type="password" autocomplete="current-password" minlength="6" required><p class="msg" id="login-msg"></p><button type="submit">登入教師評分系統</button></form></section>
<section id="portal" class="hidden"><div class="card"><h1>選擇學員</h1><p id="teacher-label"></p><div class="grid"><div><label for="unit">第一層：單位</label><select id="unit"><option value="">請先選擇單位</option></select></div><div><label for="student">第二層：員工編號與姓名</label><select id="student" disabled><option value="">請先選擇單位</option></select></div></div><p class="msg" id="portal-msg"></p></div><div class="card"><h2 id="student-title">尚未選擇學員</h2><div id="submissions"></div></div></section>
</main><script>(function(){'use strict';let token='';const login=document.getElementById('login'),portal=document.getElementById('portal'),unit=document.getElementById('unit'),student=document.getElementById('student'),msg=document.getElementById('portal-msg'),list=document.getElementById('submissions');function cloud(){return typeof google!=='undefined'&&google.script&&google.script.run}function fail(target){return e=>{target.textContent=(e&&e.message)||'系統暫時無法處理，請稍後再試'}}document.getElementById('login-form').onsubmit=e=>{e.preventDefault();const m=document.getElementById('login-msg');m.textContent='登入中…';if(!cloud()){m.textContent='請從 Apps Script 的教師雲端入口開啟此頁。';return}google.script.run.withSuccessHandler(r=>{token=r.token;m.textContent='';login.classList.add('hidden');portal.classList.remove('hidden');document.getElementById('teacher-label').textContent='已登入：'+r.email;unit.innerHTML='<option value="">請先選擇單位</option>'+r.units.map(x=>'<option>'+esc(x)+'</option>').join('')}).withFailureHandler(fail(m)).teacherLogin(document.getElementById('email').value,document.getElementById('code').value)};unit.onchange=()=>{student.disabled=true;student.innerHTML='<option>載入中…</option>';list.innerHTML='';if(!unit.value)return;if(!cloud())return;google.script.run.withSuccessHandler(r=>{student.innerHTML='<option value="">請選擇員工編號與姓名</option>'+r.students.map(x=>'<option value="'+esc(x.employeeId)+'">'+esc(x.employeeId)+'｜'+esc(x.name)+'</option>').join('');student.disabled=false;msg.textContent=r.students.length?'':'此單位的人員名冊尚未填入資料。'}).withFailureHandler(fail(msg)).teacherGetRoster(token,unit.value)};student.onchange=()=>{list.innerHTML='';if(!student.value)return;msg.textContent='載入作答中…';google.script.run.withSuccessHandler(render).withFailureHandler(fail(msg)).teacherGetSubmissions(token,unit.value,student.value)};function render(r){msg.textContent='';document.getElementById('student-title').textContent=r.student.employeeId+'｜'+r.student.name;list.innerHTML=r.submissions.length?r.submissions.map(card).join(''):'<p>目前沒有已提交的作答。</p>';list.querySelectorAll('.grade-form').forEach(f=>f.onsubmit=save)}function card(x){return '<article class="submission"><h3>'+esc(x.chapter)+'</h3><p class="meta">提交時間：'+esc(x.submittedAt)+'｜狀態：'+esc(x.status)+'</p><p class="scores">學生自評：'+x.selfTotal+'/20（'+x.scores.join('、')+'）</p><h4>學生作答／ISBAR 草稿</h4><div class="note">'+esc(x.note||'（未填寫文字草稿）')+'</div><form class="grade-form" data-id="'+esc(x.submissionId)+'"><div class="grid"><div><label>教師評分（0–100）</label><input name="score" type="number" min="0" max="100" required value="'+esc(x.teacherScore)+'"></div><div><label>批改狀態</label><select name="status"><option'+sel(x.status,'待批改')+'>待批改</option><option'+sel(x.status,'已批改')+'>已批改</option><option'+sel(x.status,'需重練')+'>需重練</option></select></div></div><label>教師評語</label><textarea name="comment" maxlength="4000">'+esc(x.teacherComment)+'</textarea><button type="submit">儲存評分</button><span class="save-status"></span></form></article>'}function save(e){e.preventDefault();const f=e.currentTarget,s=f.querySelector('.save-status'),b=f.querySelector('button');b.disabled=true;s.textContent='儲存中…';google.script.run.withSuccessHandler(()=>{b.disabled=false;s.textContent='已儲存';s.className='save-status ok'}).withFailureHandler(err=>{b.disabled=false;s.textContent=(err&&err.message)||'儲存失敗'}).teacherSaveGrade(token,unit.value,f.dataset.id,f.score.value,f.comment.value,f.status.value)}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function sel(a,b){return a===b?' selected':''}})();</script></body></html>
