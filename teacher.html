<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教師入口</title><style>:root{font-family:"Microsoft JhengHei",sans-serif;color:#173a38;background:#eef7f6}*{box-sizing:border-box}body{margin:0}.top{padding:1rem 5vw;background:#073b3a;color:#fff}.wrap{max-width:1000px;margin:2rem auto;padding:0 1rem}.card{background:#fff;padding:1.25rem;border-radius:1rem;box-shadow:0 10px 35px #073b3a18;margin-bottom:1rem}h1,h2{margin-top:0}label{display:block;font-weight:800;margin:.75rem 0 .25rem}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:.68rem;border:1px solid #79a8a5;border-radius:.5rem}button{padding:.7rem 1rem;border:0;border-radius:.5rem;background:#087f7a;color:#fff;font-weight:800;cursor:pointer;margin:.4rem .35rem .2rem 0}.secondary{background:#64748b}.danger{background:#a4342a}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.msg{min-height:1.4rem;font-weight:800;color:#a4342a}.ok{color:#087f3d}.item{border:1px solid #b7d7d5;border-radius:.7rem;padding:1rem;margin:.8rem 0}.checks{display:flex;flex-wrap:wrap;gap:.45rem}.checks label{font-weight:500;border:1px solid #b7d7d5;padding:.4rem;border-radius:.4rem;margin:0}.checks input{width:auto}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top">護理新人臨床急症情境手冊｜教師入口</header><main class="wrap">
<section class="card"><h1>教師無密碼登入</h1><div class="grid"><button id="show-login">已核准教師登入</button><button class="secondary" id="show-register">第一次註冊</button></div></section>
<section class="card" id="register"><h2>第一次註冊</h2><form id="reg-form"><div class="grid"><div><label>院內員工編號</label><input name="employeeId" required maxlength="30"><label>姓名</label><input name="name" required maxlength="60"></div><div><label>所屬單位</label><select name="unit" required><option value="">載入單位中…</option></select><label>Email</label><input name="email" type="email" required></div></div><p class="msg" id="reg-msg"></p><button>送出註冊，等待管理員核准</button></form></section>
<section class="card hidden" id="login"><h2>Email 驗證碼登入</h2><form id="login-form"><label>院內員工編號</label><input name="employeeId" required><label>Email</label><input name="email" type="email" required><button>寄送驗證碼</button><p class="msg" id="login-msg"></p></form><form id="otp-form" class="hidden"><label>六位數驗證碼</label><input name="code" inputmode="numeric" pattern="[0-9]{6}" required><button>驗證並登入</button><p class="msg" id="otp-msg"></p></form></section>
<section class="hidden" id="portal"><div class="card"><h2>選擇學員</h2><p id="who"></p><div class="grid"><div><label>第一層：單位</label><select id="unit"><option value="">請選擇單位</option></select></div><div><label>第二層：員工編號｜姓名</label><select id="student" disabled><option>請先選單位</option></select></div></div><p class="msg" id="portal-msg"></p></div><div class="card"><h2 id="student-title">尚未選擇學員</h2><div id="submissions"></div></div></section>
</main><script>(()=>{'use strict';let otpId='',token='';const q=s=>document.querySelector(s),cloud=()=>typeof google!=='undefined'&&google.script&&google.script.run,err=(el)=>(e)=>el.textContent=(e&&e.message)||'系統暫時無法處理';function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}q('#show-login').onclick=()=>{q('#login').classList.remove('hidden');q('#register').classList.add('hidden')};q('#show-register').onclick=()=>{q('#register').classList.remove('hidden');q('#login').classList.add('hidden')};if(cloud())google.script.run.withSuccessHandler(r=>q('#reg-form').unit.innerHTML='<option value="">請選單位</option>'+r.units.map(x=>'<option>'+esc(x)+'</option>').join('')).getPublicUnits();q('#reg-form').onsubmit=e=>{e.preventDefault();const f=e.currentTarget,m=q('#reg-msg');m.textContent='送出中…';google.script.run.withSuccessHandler(()=>{m.textContent='註冊完成，請等待管理員核准通知。';m.className='msg ok'}).withFailureHandler(err(m)).teacherRegister(f.employeeId.value,f.name.value,f.unit.value,f.email.value)};q('#login-form').onsubmit=e=>{e.preventDefault();const f=e.currentTarget,m=q('#login-msg');m.textContent='寄送中…';google.script.run.withSuccessHandler(r=>{otpId=r.otpId;m.textContent='驗證碼已寄到信箱。';q('#otp-form').classList.remove('hidden')}).withFailureHandler(err(m)).requestEmailCode('teacher',f.employeeId.value,f.email.value)};q('#otp-form').onsubmit=e=>{e.preventDefault();const m=q('#otp-msg');google.script.run.withSuccessHandler(r=>{token=r.token;q('#login').classList.add('hidden');q('#portal').classList.remove('hidden');q('#who').textContent=r.name+'｜'+r.email;q('#unit').innerHTML='<option value="">請選單位</option>'+r.units.map(x=>'<option>'+esc(x)+'</option>').join('')}).withFailureHandler(err(m)).verifyEmailCode(otpId,e.currentTarget.code.value)};q('#unit').onchange=()=>{const u=q('#unit').value,s=q('#student');s.disabled=true;if(!u)return;google.script.run.withSuccessHandler(r=>{s.innerHTML='<option value="">請選學員</option>'+r.students.map(x=>'<option value="'+esc(x.employeeId)+'">'+esc(x.employeeId)+'｜'+esc(x.name)+'</option>').join('');s.disabled=false}).withFailureHandler(err(q('#portal-msg'))).teacherGetRoster(token,u)};q('#student').onchange=()=>{if(!q('#student').value)return;google.script.run.withSuccessHandler(render).withFailureHandler(err(q('#portal-msg'))).teacherGetSubmissions(token,q('#unit').value,q('#student').value)};function render(r){q('#student-title').textContent=r.student.employeeId+'｜'+r.student.name;q('#submissions').innerHTML=r.submissions.length?r.submissions.map(x=>'<article class="item"><h3>'+esc(x.chapter)+'</h3><p>自評 '+x.selfTotal+'/20｜'+esc(x.submittedAt)+'</p><div>'+esc(x.note)+'</div><form class="grade" data-id="'+esc(x.submissionId)+'"><label>教師評分 0–100</label><input name="score" type="number" min="0" max="100" required value="'+esc(x.teacherScore)+'"><label>教師評語</label><textarea name="comment">'+esc(x.teacherComment)+'</textarea><label>狀態</label><select name="status"><option>待批改</option><option>已批改</option><option>需重練</option></select><button>儲存</button><span></span></form></article>').join(''):'<p>尚無作答。</p>';document.querySelectorAll('.grade').forEach(f=>f.onsubmit=e=>{e.preventDefault();const x=e.currentTarget,s=x.querySelector('span');google.script.run.withSuccessHandler(()=>s.textContent='已儲存').withFailureHandler(err(s)).teacherSaveGrade(token,q('#unit').value,x.dataset.id,x.score.value,x.comment.value,x.status.value)})}})();</script></body></html>
